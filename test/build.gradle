plugins {
    id 'java-library'
    id 'app.spellscroll.dev'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

spellscroll {
    pluginId   = 'com.example.test-plugin'
    pluginName = 'Test Plugin'
    apiVersion = '1.1.0'

    // UI module defaults:
    //   uiModuleDir             = "<projectDir>/ui-module"
    //   ignoreDefaultPluginsDir = true
    //
    // Dev assets are downloaded automatically by `spellscrollDownloadAssets` to
    //   ~/.spellscroll/dev-cache/<apiVersion>/<os>/
}
